name: Python workflow tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-mcp.txt
      - name: Install isolated MCP and test dependencies
        run: python -m pip install -r requirements-mcp.txt pytest
      - name: Test research, guarded transactions and the MCP protocol offline
        run: >-
          python -m pytest -q
          tests/test_mcp.py
          tests/test_mcp_protocol.py
          tests/test_explicit_lineup.py
          tests/test_matchup_report.py
          tests/test_matchup_tables.py
          tests/test_pickup_report.py
          tests/test_reed_waiver_watch.py
          tests/test_roster_rollover.py
          tests/test_streaming_profile.py
          tests/test_waiver_watch.py
          .agents/skills/espn-add-drop/scripts/test_add_drop.py
